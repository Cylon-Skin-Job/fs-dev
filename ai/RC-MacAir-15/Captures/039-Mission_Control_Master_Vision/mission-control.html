<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    :root {
      --bg-solid:              #000;
      --document-surface-bg:   #0d0d0d;
      --neutral-chrome-border: rgba(255, 255, 255, 0.12);
      --text-primary:          #e0e0e0;
      --text-secondary:        rgba(255, 255, 255, 0.66);
      --text-subtle:           rgba(255, 255, 255, 0.4);
      --row-hover:             rgba(255, 255, 255, 0.05);
      --row-active:            rgba(255, 255, 255, 0.09);
      --accent:                #00d4ff;
      --warn:                  #ffb020;
      --danger:                #ff5c5c;
      --ok:                    #3ddc84;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: var(--bg-solid);
      color: var(--text-primary);
      overflow: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 18px;
      line-height: 1;
      user-select: none;
    }

    .inbox {
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      background: var(--document-surface-bg);
      overflow-y: auto;
      padding: 12px 8px;
    }
    .inbox::-webkit-scrollbar { width: 10px; }
    .inbox::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      border: 3px solid var(--document-surface-bg);
    }

    .row {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .row + .row { margin-top: 2px; }
    .row:hover { background: var(--row-hover); }
    .row:active { background: var(--row-active); }
    .row:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .row-icon {
      flex: none;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      margin-top: 1px;
    }
    .row-icon.is-warn   { color: var(--warn); }
    .row-icon.is-danger { color: var(--danger); }
    .row-icon.is-ok     { color: var(--ok); }

    .row-body { flex: 1; min-width: 0; }

    .row-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .row-title .unread {
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .row-synopsis {
      margin-top: 3px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .row-time {
      flex: none;
      font-size: 12px;
      color: var(--text-subtle);
      white-space: nowrap;
      padding-top: 2px;
    }

    .row-divider {
      height: 1px;
      margin: 4px 14px;
      background: var(--neutral-chrome-border);
    }
  </style>
</head>
<body>
  <main class="inbox">

    <button class="row">
      <span class="row-icon is-danger"><span class="material-symbols-outlined">front_hand</span></span>
      <span class="row-body">
        <span class="row-title"><span class="unread"></span>Build frozen — needs input</span>
        <span class="row-synopsis">Slice builder is paused on an unresolved owner choice about stream ownership.</span>
      </span>
      <span class="row-time">9:42 AM</span>
    </button>

    <div class="row-divider"></div>

    <button class="row">
      <span class="row-icon is-warn"><span class="material-symbols-outlined">approval</span></span>
      <span class="row-body">
        <span class="row-title"><span class="unread"></span>Approval needed — Preflight</span>
        <span class="row-synopsis">Draft ready for review before the next slice. Blast radius and verification summary attached.</span>
      </span>
      <span class="row-time">8:15 AM</span>
    </button>

    <div class="row-divider"></div>

    <button class="row">
      <span class="row-icon"><span class="material-symbols-outlined">merge</span></span>
      <span class="row-body">
        <span class="row-title">Proposed merge awaiting decision</span>
        <span class="row-synopsis">Office e2e fixture lifecycle branch is green and ready to land.</span>
      </span>
      <span class="row-time">7:58 AM</span>
    </button>

    <div class="row-divider"></div>

    <button class="row">
      <span class="row-icon is-warn"><span class="material-symbols-outlined">schedule</span></span>
      <span class="row-body">
        <span class="row-title">Update wiki — Pending Merge Acceptance</span>
        <span class="row-synopsis">Watcher sync notes wait on the plugin merge decision above.</span>
      </span>
      <span class="row-time">4:30 PM</span>
    </button>

    <div class="row-divider"></div>

    <button class="row">
      <span class="row-icon is-ok"><span class="material-symbols-outlined">check_circle</span></span>
      <span class="row-body">
        <span class="row-title">Roadmap Supervisor completed pass</span>
        <span class="row-synopsis">PLUG-01 review closed with no blocking findings.</span>
      </span>
      <span class="row-time">2:11 PM</span>
    </button>

    <div class="row-divider"></div>

    <button class="row">
      <span class="row-icon"><span class="material-symbols-outlined">forum</span></span>
      <span class="row-body">
        <span class="row-title">Response needed from agent</span>
        <span class="row-synopsis">Branch Manager asked which workspace templates should share one Mission Control.</span>
      </span>
      <span class="row-time">Mon</span>
    </button>

    <div class="row-divider"></div>

    <button class="row">
      <span class="row-icon"><span class="material-symbols-outlined">history</span></span>
      <span class="row-body">
        <span class="row-title">Checkpoint written — Work Folder</span>
        <span class="row-synopsis">Readable resume point recorded for the Launchpad shaping thread.</span>
      </span>
      <span class="row-time">Sun</span>
    </button>

  </main>
</body>
</html>
