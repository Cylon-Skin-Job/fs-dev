<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wiki Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wiki-root">
    <!-- Tab bar -->
    <div class="wiki-tab-bar" id="tab-bar"></div>

    <div class="wiki-body">
      <!-- Left panel -->
      <div class="wiki-left-panel">
        <div class="wiki-left-scroll" id="left-panel"></div>
      </div>

      <!-- Detail panel -->
      <div class="wiki-detail-panel" id="detail-panel">
        <div class="wiki-detail-header" id="detail-header">
          <div class="wiki-nav-buttons">
            <button id="nav-back" class="wiki-nav-btn" title="Back"><span class="material-symbols-outlined">arrow_back</span></button>
            <button id="nav-forward" class="wiki-nav-btn" title="Forward"><span class="material-symbols-outlined">arrow_forward</span></button>
          </div>
          <div class="wiki-detail-title" id="detail-title">Wiki</div>
        </div>
        <div class="wiki-detail-scroll" id="detail-scroll"></div>
      </div>

      <!-- Right sidebar -->
      <div class="wiki-sidebar" id="sidebar">
        <div class="wiki-sidebar-scroll" id="sidebar-scroll"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../../../../view-modules/wiki/wiki-viewer/wiki-viewer.js"></script>
  <script src="../../../../view-modules/wiki/wiki-guide/wiki-guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
