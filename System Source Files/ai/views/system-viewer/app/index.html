<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="tools-root" id="tools-root">
    <!-- Body -->
    <div class="tools-body">
      <!-- Settings Panel (full width, no chat) -->
      <div class="tools-settings">

        <!-- Tab header info -->
        <div class="tools-settings-header" id="tab-header">
          <div class="tools-settings-header-info">
            <div class="tools-settings-header-title" id="tab-title">Connectors</div>
            <div class="tools-settings-header-desc" id="tab-desc">
              Manage MacOS system integrations — Mail, Calendar, Notes, and Reminders.
            </div>
          </div>
        </div>

        <!-- Tab bar -->
        <div class="tools-settings-tabs" id="tab-bar">
          <button class="tools-settings-tab active" data-tab="connectors">
            <span class="material-symbols-outlined">linked_services</span>
            Connectors
          </button>
          <button class="tools-settings-tab" data-tab="skills">
            <span class="material-symbols-outlined">psychology</span>
            Skills
          </button>
          <button class="tools-settings-tab" data-tab="triggers">
            <span class="material-symbols-outlined">bolt</span>
            Triggers
          </button>
          <button class="tools-settings-tab" data-tab="scripts">
            <span class="material-symbols-outlined">code</span>
            Scripts
          </button>
          <button class="tools-settings-tab" data-tab="hooks">
            <span class="material-symbols-outlined">link</span>
            Hooks
          </button>
        </div>

        <!-- Split: list + detail -->
        <div class="tools-settings-split">

          <!-- Settings list -->
          <div class="tools-settings-list" id="settings-list">
            <!-- Populated by JS -->
          </div>

          <!-- Center panel: detail -->
          <div class="tools-detail" id="detail-panel">
            <div class="tools-detail-header" id="detail-header">
              <div class="tools-detail-nav">
                <button class="tools-detail-nav-btn" id="nav-back" title="Back">
                  <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <button class="tools-detail-nav-btn" id="nav-forward" title="Forward">
                  <span class="material-symbols-outlined">arrow_forward</span>
                </button>
              </div>
              <div class="tools-detail-title" id="detail-title">Connectors</div>
              <button class="tools-detail-copy" id="detail-copy" title="Copy path">
                <span class="material-symbols-outlined">link_2</span>
              </button>
            </div>
            <div class="tools-detail-scroll" id="detail-scroll">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Right sidebar -->
          <div class="tools-sidebar" id="sidebar">
            <div class="tools-sidebar-header">
              <span class="tools-sidebar-title">Related</span>
            </div>
            <div class="tools-sidebar-scroll" id="sidebar-scroll">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Material Symbols font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
